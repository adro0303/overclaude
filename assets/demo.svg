<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Claude keeps working on your machine, you get pinged on your phone">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#181d24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="210" fill="url(#dbg)"/>

  <!-- PC card -->
  <rect x="40" y="50" width="260" height="100" rx="14" fill="#1b2126" stroke="#3a4048" stroke-width="1.5"/>
  <text x="170" y="97" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="22" fill="#ef5b2c">&gt;_ claude</text>
  <text x="170" y="123" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4ab">working, unattended, on your machine</text>

  <!-- connection -->
  <line x1="300" y1="100" x2="700" y2="100" stroke="#3a4048" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- traveling packet -->
  <circle r="7" fill="#ef5b2c">
    <animateMotion path="M300,100 L700,100" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- phone card -->
  <rect x="700" y="15" width="140" height="170" rx="20" fill="#1b2a33" stroke="#4fbac9" stroke-width="1.5"/>
  <circle cx="770" cy="30" r="3.5" fill="#4fbac9" opacity="0.6"/>
  <text x="770" y="108" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e7ecee">Claude mobile</text>
  <text x="770" y="124" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ab">/ Telegram</text>

  <!-- notification badge, pulses when the packet arrives -->
  <g transform="translate(815,26)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1;1.5;1;1" keyTimes="0;0.82;0.9;0.97;1" dur="2.4s" repeatCount="indefinite"/>
      <circle r="11" fill="#ef5b2c">
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.8;0.88;0.97;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dominant-baseline="central" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#141210">
        1
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.88;0.97;1" dur="2.4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <text x="450" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4ab">Claude keeps working — you only get pinged the moment it needs you.</text>
</svg>
