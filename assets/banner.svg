<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Overclaude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#181d24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#ef5b2c"/>

  <!-- wordmark -->
  <text x="60" y="150" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="66" font-weight="700" letter-spacing="1" fill="#f3f2ee">OVERCLAUDE</text>
  <text x="63" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9aa4ab">More Claude Code out of the Claude Code you already have.</text>

  <!-- tick line under tagline -->
  <rect x="63" y="208" width="360" height="3" rx="1.5" fill="#ef5b2c"/>

  <!-- gauge -->
  <g>
    <path d="M 935 150 A 85 85 0 0 1 1105 150" fill="none" stroke="#3a4048" stroke-width="10" stroke-linecap="round"/>
    <path d="M 1088.76 100.02 A 85 85 0 0 1 1105 150" fill="none" stroke="#ef5b2c" stroke-width="10" stroke-linecap="round"/>

    <!-- ticks -->
    <line x1="935" y1="150" x2="925" y2="150" stroke="#5b636b" stroke-width="3"/>
    <line x1="951.2" y1="100.0" x2="943.1" y2="94.1" stroke="#5b636b" stroke-width="3"/>
    <line x1="993.7" y1="69.2" x2="990.6" y2="59.7" stroke="#5b636b" stroke-width="3"/>
    <line x1="1046.3" y1="69.2" x2="1049.4" y2="59.7" stroke="#5b636b" stroke-width="3"/>
    <line x1="1088.8" y1="100.0" x2="1096.9" y2="94.1" stroke="#ef5b2c" stroke-width="3"/>
    <line x1="1105" y1="150" x2="1115" y2="150" stroke="#ef5b2c" stroke-width="3"/>

    <!-- needle, pinned past redline -->
    <line x1="1020" y1="150" x2="1083.4" y2="120.4" stroke="#f3f2ee" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1020" cy="150" r="8" fill="#f3f2ee"/>

    <text x="1020" y="205" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#ef5b2c">OVERCLOCKED</text>
  </g>
</svg>
